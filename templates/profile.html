{% extends "base.html" %}
{% block title %}My Profile – TruthGuard{% endblock %}

{% block content %}
<section class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="tg-glass-card p-4 p-md-5 text-center">
        <i class="bi bi-person-circle" style="font-size: 4rem;"></i>
        <h3 class="mt-2 mb-0">{{ current_user.username }}</h3>
        <p class="text-muted">{{ current_user.email }}</p>
        <p class="text-muted small">Member since {{ current_user.created_at.strftime('%B %Y') }}</p>

        <div class="row g-3 mt-3">
          <div class="col-4">
            <div class="tg-stat-card"><span class="tg-stat-value">{{ total }}</span><span class="tg-stat-label">Total</span></div>
          </div>
          <div class="col-4">
            <div class="tg-stat-card tg-stat-fake"><span class="tg-stat-value">{{ fake }}</span><span class="tg-stat-label">Fake</span></div>
          </div>
          <div class="col-4">
            <div class="tg-stat-card tg-stat-real"><span class="tg-stat-value">{{ real }}</span><span class="tg-stat-label">Real</span></div>
          </div>
        </div>

        <a href="{{ url_for('history') }}" class="btn tg-btn-primary mt-4"><i class="bi bi-clock-history"></i> View Full History</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
